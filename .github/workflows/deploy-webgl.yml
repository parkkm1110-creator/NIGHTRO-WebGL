name: Deploy WebGL (BETA V1) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-webgl.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing Build_011.zip'
        required: true
        default: 'Webgl-V1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download WebGL release archive
        env:
          TAG: ${{ inputs.release_tag || 'Webgl-V1' }}
        run: |
          mkdir -p _site
          curl -fL "https://github.com/${{ github.repository }}/releases/download/${TAG}/Build_011.zip" -o /tmp/Build_011.zip
          python3 -c "import os, shutil, zipfile
          with zipfile.ZipFile('/tmp/Build_011.zip') as z:
              for m in z.infolist():
                  name = m.filename.replace('\\\\', '/').lstrip('/')
                  if not name or name.endswith('/'): continue
                  dest = os.path.join('_site', name)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with z.open(m) as src, open(dest, 'wb') as dst:
                      shutil.copyfileobj(src, dst)"
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
