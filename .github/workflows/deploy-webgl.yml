name: Deploy WebGL (BETA V1) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-webgl.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing Build_011.zip'
        required: true
        default: 'Webgl-V1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download WebGL release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'Webgl-V1' }}
        run: |
          mkdir -p _site
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "Build_011.zip" --dir /tmp
          unzip -q /tmp/Build_011.zip -d _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
